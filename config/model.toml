# AppTopicsQuants model: EVERY tunable number, one section per methodology step (docs/METHODOLOGY.md).
# Sections are named [stepN.<name>]; the code reads them flattened by <name> (settings.weights()["filters"] ...).
# The backtest's model version is a hash of this whole file, so changing any number starts a new model version.
# Log every change in docs/CHANGELOG.md.
#
# Design target: a small company aiming for >= $5,000/month per app within 12 months
# (roughly the top 5-10% of subscription apps at one year; RevenueCat SOSA 2026: top 10%
# earn > $2,500/month). We do NOT care about the leader. A keyword's sector is its full
# results page; we ask whether the 5th-20th percentile of that sector earns the target
# and how concentrated the money is.

[target]
monthly_usd = 5000
sector_band = [0.05, 0.20]   # percentile band (by est. revenue) a strong newcomer can reach
min_sector_size = 30   # relevant apps needed for a p5-p20 band to mean something (13 apps -> band = top 3 = the leaders)

[constraints]
# Fed to the DeepSeek buildability check (factor 'buildability', 0..1).
description = """Small team. iOS and Android apps, native or cross-platform. At most light cloud sync.
Third-party AI APIs are fine. No heavy backend or realtime infrastructure, no marketplaces or
social networks needing critical mass, no content licensing (music, video, sports data), no
hardware, no regulated finance (banking, trading, lending) or medical-diagnosis claims. Also not buildable:
server-side AI video or image generation we would have to host (thin wrappers over third-party AI APIs are fine),
streaming of licensed shows, films, sports or music, gambling and betting picks, crypto mining or earn-money schemes."""

# ======================================================================= Step 1. Universe
[step1.universe]
# Apple popularity (1-100) -> searches per day: at_40 x per_point^(popularity - 40).
# 5 -> 0.5/day, 20 -> 4/day, 35 -> 35/day, 60 -> 1,150/day. Uncalibrated; checked against Google volume in the changelog.
searches_per_day_at_40 = 70.0
searches_per_day_per_point = 1.15
# Long-tail terms get a results page (iTunes) once their Astro popularity reaches this.
fetch_min_popularity = 15

[step1.expand]
# Where new searches come from (apptopics expand ...). Seeds = graded needs.
seed_grades = "AB"              # autocomplete seeds: needs with these grades (A/B/C since 2026-11-05)
seeds_max = 4000                # best-first cap on plain autocomplete seeds (~1.7 h at 40/min)
alpha_max_seeds = 150           # seeds that get "seed a..z" (26 queries each: 150 seeds ~1.6 h)
hint_alphabet_grades = "A"      # capped by alpha_max_seeds, best first. also try "seed a" .. "seed z" for these grades (26 requests per seed). 2026-11-05: grade B a..z = ~4.5 h for 12 C+ terms, so A only
title_grades = "AB"             # mine competitor names/subtitles on these keywords' results pages
title_top_apps = 30             # apps per results page used for title mining
title_min_apps = 3              # a phrase must appear in this many different apps' titles
title_max_new = 3000            # cap per run (Astro measures ~5,000 terms/hour)
play_suggest = true             # Google Play autocomplete (free, unofficial endpoint)
dfs_apps = 25                   # DataForSEO Play keywords_for_app pilot: top Play apps of visible A/B searches (~$0.035/app)
dfs_max_usd = 1.0               # hard stop for that pilot per run
redo_after_days = 28            # alphabet seeds / DFS apps expanded within this many days are skipped (data/cache/expand_done.json)
hints_per_minute = 40           # App Store autocomplete; 60/min drew 429s from Apple after ~1 h (2026-11-05)
weekly = true                   # run-weekly ends with expand collect + finish (needs Astro running)
weekly_sources = "titles,hints,play"   # kept 2026-11-05: C+ / terms with a page: titles 31%, hints 35%, play 23% (all free)
weekly_pilots = "reddit,dfs_play_app"   # 2026-11-05: reddit 52% C+ of terms with a page ($0.42); dfs 30% ($1.70 / 50 apps, 54 Build now). dfs skips apps done in the last redo_after_days, capped by dfs_max_usd

[step1.labels]
# DeepSeek gives every search a TYPE (need / brand / rubbish) and, for needs, a SPECIFICITY 1-5:
#   5 one clear job with a qualifier ('hiit timer')   4 a clear job ('timer widget')   3 a broad but real need ('timer')
#   2 a whole category or tool word ('compass')       1 an everyday word that names no app need ('real')
# Score multiplier per specificity 1..5. Anchored (2026-11-05, decision 17): specific searches (4, 5) keep their full
# score, only vague ones are cut. The linear rule (0.5 .. 1.0) dropped 146 solid Build-now searches (room design,
# camera scanner) to Watch because the grade cutoffs are set on the unmultiplied scale.
specificity_mults = [0.5, 0.65, 0.8, 1.0, 1.0]
brand_check_min_p = 0.7      # second label pass (expand brand-check): p >= this names a company/device/app -> label brand
# fallback when specificity_mults is empty: specificity_base + specificity_step x (specificity - 1)
specificity_base = 0.5
specificity_step = 0.125
specificity_unknown = 1.0       # multiplier while a need has no specificity yet (labelled before the new scheme)
# composite (Appendix B) penalty = composite_penalty x (5 - specificity) / 4  (was: vague -8, broad -3)
composite_penalty = 8.0

# ======================================================================= Step 3. Revenue
[step3.monetization]
# Per-app monthly revenue estimate (see metrics/sector.py).
calibrated = true
# grossing chart: monthly_usd = a * eff_rank ** (-b); eff_rank = overall rank, or genre rank * 8
a = 10000000   # prior: Distimo #50 overall ≈ $360k/mo and Perry #871 ≈ $21k/mo both fit a≈1e7 at b=0.86
b = 0.86   # grossing power-law slope: Garg & Telang (iPhone grossing Pareto shape 0.860); a still uncalibrated
# last resort when no dates are known: lifetime ratings * usd_per_rating_month
usd_per_rating_month = 0.5
# Calibrated 2026-11-02 on 487 verified-revenue apps (TrustMRR + MobileMRR, worldwide revenue) vs their US iOS
# ratings per month since release: running median (±0.4 decade window, >= 30 apps per knot), monotone,
# log-log interpolation; beyond the last knot slope 0.9. Revenue grows ~0.6-0.8 power of rating velocity.
rpm_knots = [0.5, 1, 2, 4, 8, 16, 32, 64]
usd_knots = [225, 272, 459, 584, 792, 1063, 1712, 3153]
# Spread of real revenue around the curve (log10 sd). P(app >= target) = Phi((log10(est) - log10(target)) / sigma).
est_sigma_log10 = 0.77

# ======================================================================= Step 5. Filters
[step5.filters]
max_brandness = 0.6
min_popularity = 5
# Concentration cutoff is RELATIVE: exclude the most concentrated share of sectors (0.9 = drop the top 10%,
# AI-chat-style winner-take-all markets). Below that, the concentration weight is a sliding penalty.
# (A fixed 0.7 removed 74% of keywords: almost every app market is top-heavy.)
max_concentration_pct = 0.9
# A keyword's sector counts only the apps that actually serve it (keyword words in name/subtitle/description).
relevant_apps_only = true
# DeepSeek keyword types hidden from the ranking and paid fetches.
hide_labels = ["brand", "rubbish"]
# Hide keywords with fewer than [target].min_sector_size relevant apps (no market data to judge them).
require_sector = true
# Hide needs DeepSeek judges unbuildable under [constraints] (licensed content, hardware, regulated finance...).
min_buildability = 0.3
# Hide niches whose p5-p20 band earns less than this (calibrated $/month): too small to reach the $5k target.
min_band_usd = 1000
# Entries whose composite is backed by less than this share of total weight are excluded from the
# ranking (they only have demand/trending, no sector data yet).
min_coverage = 0.5
# Optional hard cutoff on difficulty. Off: hard markets stay visible (penalised by the difficulty weight and shown
# in the 'hard' zone of the map) because knowing a niche is hard is the point. Set e.g. 95 to hide them.
# max_difficulty = 95
# Game sectors (>= 60% of the top-10 apps are Games) are a different business; flip to false to include them.
exclude_game_sectors = true
# Needs we will not build (regulated gambling/lending, server-heavy VPN). Substring match on the keyword.
# The DeepSeek buildability factor replaces this list once a key is set.
exclude_terms = ["casino", "slots", "jackpot", "sweepstake", "betting", "sportsbook", "poker", "blackjack", "lottery",
                 "cash advance", "payday", "loan", "borrow money", "vpn", "proxy", "v2ray", "shadowrocket",
                 "earn money", "make money", "money fast", "get paid", "cash app", "free money", "downloader", "free movie",
                 "movies free", "free tv", "watch movies",
                 "live stream free", "live football", "football live", "live soccer", "soccer live", "live sports tv", "sports live stream", "iptv",
                 "streaming free", "movies for free"]
# Keywords in non-Latin scripts (Arabic, Cyrillic, CJK, ...) are real US-store searches but not our market;
# they are skipped when selecting keywords to research and excluded from the ranking. Set false to keep them.
latin_only = true

# ======================================================================= Step 6. Score, grade, action
[step6.score]
# opp_score = 100 x money^money_exp x reach^reach_exp x demand^demand_exp x concentration x buildability x trend
money_exp = 0.45
reach_exp = 0.35
demand_exp = 0.20

# money: band revenue on a log scale + P(app >= target), then blended with the optional signals below
band_usd_zero = 1000          # band revenue that scores 0 ...
band_usd_full = 30000         # ... and 1 (log scale; $5k ~ 0.47)
money_band_share = 0.5        # rest = P(>= target) / p5k_full
p5k_full = 0.4
newcomers_share = 0.3         # blend with young winners (newcomers_full of them = 1)
newcomers_full = 4
ads_share = 0.15              # blend with Meta ad activity
cpc_share = 0.2               # blend with Google CPC (cpc_zero -> 0, cpc_full -> 1)
cpc_zero = 0.2
cpc_full = 3.0

# reach: difficulty curve 1 / (1 + exp((difficulty - midpoint) / slope)) + weak spots + newcomer share
reach_curve_share = 0.5
reach_weak_share = 0.3
reach_weak_full = 4
reach_entrant_share = 0.2

# demand: log searches/day (1/day -> 0, demand_full_per_day -> 1), blended with Google volume and video views
demand_full_per_day = 2000
google_share = 0.25           # log10 Google monthly searches: google_log_zero -> 0, google_log_full -> 1
google_log_zero = 2
google_log_full = 5
social_share = 0.25           # log10 TikTok + YouTube views: can only raise demand
social_log_zero = 4
social_log_full = 7

# multipliers
conc_free = 0.5               # top-5% revenue share up to this costs nothing ...
conc_span = 0.45              # ... then falls linearly by conc_max_penalty over this span
conc_max_penalty = 0.5
build_base = 0.5              # buildability multiplier = build_base + (1 - build_base) x buildability
build_unknown = 0.85
trend_apple_div = 20          # Apple weekly change / trend_apple_div, clipped to +-trend_max
trend_google_div = 2          # Google 12-month growth / trend_google_div, clipped to +-trend_max (blended 50/50)
trend_max = 0.15

[step6.reach]
# Difficulty curve used by opp_score's reach part and by the composite's reach gating:
# 1 / (1 + exp((difficulty - midpoint) / slope)): ~0.92 at difficulty 50, 0.5 at 70, 0.08 at 90.
# Positive composite contributions of the gated metrics are multiplied by it.
gated = ["breadth", "attainable", "monetization", "demand"]
midpoint = 70
slope = 8

[step6.grades]
# Opportunity grades are evidence checks, not score cut-offs (decided 2026-11-05): A = can earn (all four checks pass),
# B = maybe (money exists but a check fails or is unknown), C = no (no money, hard to build, brand/rubbish/games).
# The opportunity score only orders searches inside a grade. Topics take their best search's grade; research aspects
# use the same checks. Action: A Build now, B Maybe, C No.
a_money_usd = 5000          # p5-p20 apps of the niche earn at least this (= [target] monthly_usd)
a_young_min = 2             # at least this many apps under 2 years old earn $5k+ (one could be a fluke; two is a pattern)
a_min_popularity = 30       # ~17 searches/day: enough organic traffic for first users without ads
a_min_buildability = 0.6    # judged buildable by a small team; judged below this -> C
b_money_usd = 1000          # B needs some money: band >= this or at least one young winner; else C
# Score cut-offs: used only by the ASO score now (and the backtest's score buckets)
A = 50
B = 38
C = 28
D = 18

[step6.actions]
build_now_min_buildability = 0.6   # kept for older readers; the grade check is a_min_buildability

[step6.aso]
# aso_score = 100 x demand^demand_exp x ease^ease_exp, ease = ease_floor + (1 - ease_floor) x min(1, weak spots / weak_full)
demand_exp = 0.5
ease_exp = 0.5
ease_floor = 0.1
weak_full = 5
target_min_weak = 3                # Target now: >= this many weak spots ...
target_min_popularity = 20         # ... and popularity >= this
skip_below_popularity = 15

# ======================================================================= Step 7. Topics
[step7.topics]
# topic score = best x best member + top3 x mean(top-3 members) + min(bonus_max, bonus_per x log2(1 + members graded A-C))
#               x traffic adjustment (traffic_floor at traffic_low_per_day searches/day -> 1.0 at traffic_high_per_day)
best = 0.75
top3 = 0.25
bonus_per = 2.0
bonus_max = 6.0
traffic_floor = 0.9
traffic_low_per_day = 5
traffic_high_per_day = 1000

# ======================================================================= Step 8. Research verdict
[step8.verdict]
# One grade per aspect: weighted mean of the parts it has data for.
opening = 0.30
people_care = 0.25
newcomers_win = 0.20
someone_pays = 0.15
white_space = 0.10
# opening part by crowdedness band
band_emerging = 1.0
band_empty = 0.7
band_crowded = 0.35
band_saturated = 0.1
# full marks at
views_zero_log = 4             # log10 video views: 10k -> 0 ...
views_full_log = 7             # ... 10M -> 1
young_full = 4
advertisers_full = 3
wishes_full = 3
young_months = 24
# grade cut-offs (0-100)
A = 80
B = 65
C = 50
D = 35

# ======================================================================= Appendix B. Composite (older score)
[appendixB.composite]
# Factor values are z-scored across the universe before weighting. Positive = higher is better for a small team.
intent = 0.8
weak_spots = 0.6     # top-10 apps with < 100 ratings: page one is reachable for a new app
breadth = 2.0         # share of sector apps earning >= target (core question: do p5-p20 apps make $5k?)
attainable = 2.0      # p5-p20 band revenue vs target
concentration = -1.0  # winner-take-all sectors are useless to us
entrant_share = 0.6   # newcomers reach the paying band
newcomer_winners = 1.0 # young apps (< 2 years) already earn the target anywhere in the sector: the market pays newcomers
indie_share = 0.4     # small developers sit in the band
momentum = 0.8
trending = 0.6        # Apple weekly popularity change (Apple Ads Platform API)
demand = 0.5          # enough searches to matter; giant demand attracts giants
monetization = 0.2    # someone pays here at all
competition = -0.6
difficulty = -1.0
brandness = -1.5
buildability = 0.8
play_iap_share = 0.2
play_grossing = 0.3
llm_appeal = 0.4
# off-store demand and monetization intent (DataForSEO)
search_volume = 0.3
cpc = 0.4
trend_slope = 0.7
trend_level = 0.2
# off-store interest and paid acquisition (ScrapeCreators: research aspects and sampled topics only)
social_views = 0.3    # log10 TikTok + YouTube views about the need
ad_activity = 0.4     # top apps keep paying for Meta ads (verified), weighted by how long the ads have run
# openings signalled by users
review_neg_share = 0.3
review_gap = 0.5

# ======================================================================= Run settings (not model weights)
[run.sources]
# search_backend: auto (dataforseo when configured, else astro if running, else itunes) | dataforseo | itunes | astro
# Astro is optional: universe comes from the Apple Ads API, difficulty is computed from the sector.
search_backend = "auto"
search_top = 1000          # keywords per weekly search refresh (dataforseo/itunes); astro falls back to 300
