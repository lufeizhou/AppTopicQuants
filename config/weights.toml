# Composite score weights. Positive = higher is better for a small team.
# Factor values are z-scored across the universe before weighting.
#
# Design target: a small company aiming for >= $5,000/month per app within 12 months
# (roughly the top 5-10% of subscription apps at one year; RevenueCat SOSA 2026: top 10%
# earn > $2,500/month). We do NOT care about the leader. A keyword's sector is its full
# results page; we ask whether the 5th-20th percentile of that sector earns the target
# and how concentrated the money is.

[target]
monthly_usd = 5000
sector_band = [0.05, 0.20]   # percentile band (by est. revenue) a strong newcomer can reach
min_sector_size = 30   # relevant apps needed for a p5-p20 band to mean something (13 apps -> band = top 3 = the leaders)

[constraints]
# Fed to the DeepSeek buildability check (factor 'buildability', 0..1).
description = """Small team. iOS and Android apps, native or cross-platform. At most light cloud sync.
Third-party AI APIs are fine. No heavy backend or realtime infrastructure, no marketplaces or
social networks needing critical mass, no content licensing (music, video, sports data), no
hardware, no regulated finance (banking, trading, lending) or medical-diagnosis claims. Also not buildable:
server-side AI video or image generation we would have to host (thin wrappers over third-party AI APIs are fine),
streaming of licensed shows, films, sports or music, gambling and betting picks, crypto mining or earn-money schemes."""

[composite]
intent = 0.8
weak_spots = 0.6     # top-10 apps with < 100 ratings: page one is reachable for a new app
breadth = 2.0         # share of sector apps earning >= target (core question: do p5-p20 apps make $5k?)
attainable = 2.0      # p5-p20 band revenue vs target
concentration = -1.0  # winner-take-all sectors are useless to us
entrant_share = 0.6   # newcomers reach the paying band
newcomer_winners = 1.0 # young apps (< 2 years) already earn the target anywhere in the sector: the market pays newcomers
indie_share = 0.4     # small developers sit in the band
momentum = 0.8
trending = 0.6        # Apple weekly popularity change (Apple Ads Platform API)
demand = 0.5          # enough searches to matter; giant demand attracts giants
monetization = 0.2    # someone pays here at all
competition = -0.6
difficulty = -1.0
brandness = -1.5
buildability = 0.8
play_iap_share = 0.2
play_grossing = 0.3
llm_appeal = 0.4
# off-store demand and monetization intent (DataForSEO)
search_volume = 0.3
cpc = 0.4
trend_slope = 0.7
trend_level = 0.2
# off-store interest and paid acquisition (ScrapeCreators: research aspects and sampled topics only)
social_views = 0.3    # log10 TikTok + YouTube views about the need
ad_activity = 0.4     # top apps keep paying for Meta ads (verified), weighted by how long the ads have run
# openings signalled by users
review_neg_share = 0.3
review_gap = 0.5

[reach]
# Revenue upside only matters if a newcomer can reach the p5-p20 band. Positive contributions of these
# metrics are multiplied by reach = 1 / (1 + exp((difficulty - midpoint) / slope)): ~0.92 at difficulty 50,
# 0.5 at 70, 0.08 at 90. Negative contributions (poor revenue) always count in full.
gated = ["breadth", "attainable", "monetization", "demand"]
midpoint = 70
slope = 8

[sources]
# search_backend: auto (dataforseo when configured, else astro if running, else itunes) | dataforseo | itunes | astro
# Astro is optional: universe comes from the Apple Ads API, difficulty is computed from the sector.
search_backend = "auto"
search_top = 1000          # keywords per weekly search refresh (dataforseo/itunes); astro falls back to 300

[filters]
max_brandness = 0.6
min_popularity = 5
# Concentration cutoff is RELATIVE: exclude the most concentrated share of sectors (0.9 = drop the top 10%,
# AI-chat-style winner-take-all markets). Below that, the concentration weight is a sliding penalty.
# (A fixed 0.7 removed 74% of keywords: almost every app market is top-heavy.)
max_concentration_pct = 0.9
# A keyword's sector counts only the apps that actually serve it (keyword words in name/subtitle/description).
relevant_apps_only = true
# DeepSeek keyword labels (apptopics llm labels): these labels are hidden from the ranking and paid fetches.
hide_labels = ["brand", "rubbish"]
# 'vague' keywords ('real', 'wonder', 'treat') stay visible but lose this many composite points.
vague_penalty = 8.0
# 'broad': real but very wide single-word categories (compass, keyboard, chat). Milder penalty than vague.
broad_penalty = 3.0
# Hide keywords with fewer than [target].min_sector_size relevant apps (no market data to judge them).
require_sector = true
# Hide needs DeepSeek judges unbuildable under [constraints] (licensed content, hardware, regulated finance...).
min_buildability = 0.3
# Hide niches whose p5-p20 band earns less than this (calibrated $/month): too small to reach the $5k target.
min_band_usd = 1000
# Entries whose composite is backed by less than this share of total weight are excluded from the
# ranking (they only have demand/trending, no sector data yet).
min_coverage = 0.5
# Optional hard cutoff on difficulty. Off: hard markets stay visible (penalised by the difficulty weight and shown
# in the 'hard' zone of the map) because knowing a niche is hard is the point. Set e.g. 95 to hide them.
# max_difficulty = 95
# Game sectors (>= 60% of the top-10 apps are Games) are a different business; flip to false to include them.
exclude_game_sectors = true
# Needs we will not build (regulated gambling/lending, server-heavy VPN). Substring match on the keyword.
# The DeepSeek buildability factor replaces this list once a key is set.
exclude_terms = ["casino", "slots", "jackpot", "sweepstake", "betting", "sportsbook", "poker", "blackjack", "lottery",
                 "cash advance", "payday", "loan", "borrow money", "vpn", "proxy", "v2ray", "shadowrocket",
                 "earn money", "make money", "money fast", "get paid", "cash app", "free money", "downloader", "free movie",
                 "movies free", "free tv", "watch movies",
                 "live stream free", "live football", "football live", "live soccer", "soccer live", "live sports tv", "sports live stream", "iptv",
                 "streaming free", "movies for free"]
# Keywords in non-Latin scripts (Arabic, Cyrillic, CJK, ...) are real US-store searches but not our market;
# they are skipped when selecting keywords to research and excluded from the ranking. Set false to keep them.
latin_only = true

[monetization]
# Per-app monthly revenue estimate (see metrics/sector.py). UNCALIBRATED defaults.
calibrated = true
# grossing chart: monthly_usd = a * eff_rank ** (-b); eff_rank = overall rank, or genre rank * 8
a = 10000000   # prior: Distimo #50 overall ≈ $360k/mo and Perry #871 ≈ $21k/mo both fit a≈1e7 at b=0.86
b = 0.86   # grossing power-law slope: Garg & Telang (iPhone grossing Pareto shape 0.860); a still uncalibrated
# last resort when no dates are known: lifetime ratings * usd_per_rating_month
usd_per_rating_month = 0.5
# Calibrated 2026-11-02 on 487 verified-revenue apps (TrustMRR + MobileMRR, worldwide revenue) vs their US iOS
# ratings per month since release: running median (±0.4 decade window, >= 30 apps per knot), monotone,
# log-log interpolation; beyond the last knot slope 0.9. Revenue grows ~0.6-0.8 power of rating velocity.
rpm_knots = [0.5, 1, 2, 4, 8, 16, 32, 64]
usd_knots = [225, 272, 459, 584, 792, 1063, 1712, 3153]
# Spread of real revenue around the curve (log10 sd). P(app >= target) = Phi((log10(est) - log10(target)) / sigma).
est_sigma_log10 = 0.77
